<!-- Hero Section -->
<div class="hero-header shadow rounded-lg p-6 mb-6 flex justify-between items-center">
    <div>
        <h1 class="text-2xl font-bold">Organizations</h1>
        <p class="opacity-90 text-sm">Manage registered Organizations in the system.</p>
    </div>
    <a href="#/organizations/new" class="bg-white text-blue-600 hover:bg-gray-100 font-bold py-2 px-4 rounded shadow transition duration-200">Add New Organization</a>
</div>

<!-- Controls Section -->
<div class="mb-6 flex justify-between items-center">
    <div class="relative w-72">
        <input type="text" id="organization-search" placeholder="Search Organizations..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
    </div>
</div>

<div class="bg-white shadow-md rounded-lg overflow-hidden">
    <table class="min-w-full leading-normal">
        <thead>
            <tr>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider cursor-pointer hover:bg-gray-200" data-sort="name">Name <span class="sort-indicator inline-block ml-1"></span></th>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider cursor-pointer hover:bg-gray-200" data-sort="region">Region <span class="sort-indicator inline-block ml-1"></span></th>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider cursor-pointer hover:bg-gray-200" data-sort="province">Province <span class="sort-indicator inline-block ml-1"></span></th>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Actions</th>
            </tr>
        </thead>
        <tbody id="organization-table-body">
            <tr>
                <td colspan="4" class="text-center">Loading...</td>
            </tr>
        </tbody>
    </table>
</div>
